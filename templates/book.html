<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book['Book-Title'] }} - Book Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #e6f7fa;
        }
        .header-section {
            background: #e6f7fa;
            padding: 2.5rem 0 1.5rem 0;
            text-align: center;
        }
        .header-section h1 {
            font-weight: bold;
            color: #0099b8;
        }
        .book-detail-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            padding: 2rem;
            margin: 2rem auto;
            max-width: 900px;
        }
        .book-cover-lg {
            width: 180px;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .book-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0099b8;
        }
        .book-author {
            color: #0099b8;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .book-meta {
            font-size: 1rem;
            color: #888;
        }
        .book-isbn {
            font-size: 1rem;
            color: #888;
        }
        .book-desc {
            margin-top: 1.5rem;
            font-size: 1.05rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="header-section">
        <h1>Book Recommendation System</h1>
    </div>
    <div class="book-detail-card">
        <div class="row">
            <div class="col-md-4 text-center">
                <img src="{{ book['Image-URL-L'] or 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/387928/book%20placeholder.png' }}" alt="{{ book['Book-Title'] }}" class="book-cover-lg mb-3" onerror="this.src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/387928/book%20placeholder.png'">
                <button id="favoriteBtn" class="btn btn-outline-danger w-100" onclick="toggleFavorite('{{ book['ISBN'] }}')">
                    <i id="favoriteIcon" class="fas fa-heart"></i> <span id="favoriteText">Favorite this book</span>
                </button>
                <a href="/favorites" class="btn btn-outline-primary w-100 mt-2">
                    <i class="fas fa-heart"></i> My Favorites
                </a>
                <a href="/" class="btn btn-outline-secondary w-100 mt-2">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
            <div class="col-md-8">
                <div class="book-title">{{ book['Book-Title'] }}</div>
                <div class="book-author"><i class="fas fa-user"></i> {{ book['Book-Author'] }}</div>
                <div class="book-meta mb-2">
                    <i class="fas fa-calendar-alt"></i> {{ book['Year-Of-Publication'] }}<br>
                    <i class="fas fa-building"></i> {{ book['Publisher'] }}<br>
                    <span class="book-isbn"><i class="fas fa-barcode"></i> ISBN: {{ book['ISBN'] }}</span>
                </div>
                <div class="book-desc">
                    {% if book['Summary'] %}
                        {{ book['Summary'] }}
                    {% else %}
                        <span class="text-muted">No description available.</span>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    let userId = null;
    
    $(document).ready(function() {
        initUserId();
        checkFavoriteStatus('{{ book['ISBN'] }}');
    });
    
    // 初始化用户ID
    function initUserId() {
        // 从URL或session中获取用户ID
        const urlParams = new URLSearchParams(window.location.search);
        const urlUserId = urlParams.get('user_id');
        
        if (urlUserId) {
            // 如果URL中存在用户ID，使用并存储它
            userId = urlUserId;
            localStorage.setItem('user_id', userId);
        } else {
            // 否则从localStorage获取，如果没有，将在下一次页面加载时由后端分配
            userId = localStorage.getItem('user_id');
        }
        
        console.log("初始化用户ID:", userId);
        return userId;
    }
    
    // 检查是否已收藏
    function checkFavoriteStatus(isbn) {
        console.log("检查收藏状态，用户ID:", userId, "ISBN:", isbn);
        
        fetch(`/user/favorites?user_id=${userId}`)
            .then(response => {
                console.log("收藏状态响应:", response.status);
                return response.json();
            })
            .then(data => {
                console.log("收藏数据:", data);
                if (!data.error && data.books) {
                    // 检查当前图书是否在收藏列表中
                    const isFavorite = data.books.some(book => book.ISBN === isbn);
                    console.log("是否已收藏:", isFavorite);
                    updateFavoriteButton(isFavorite);
                } else {
                    console.log("没有收藏数据或发生错误:", data.error || "无收藏");
                }
            })
            .catch(error => console.error('获取收藏状态失败:', error));
    }
    
    // 更新收藏按钮状态
    function updateFavoriteButton(isFavorite) {
        const btn = document.getElementById('favoriteBtn');
        const icon = document.getElementById('favoriteIcon');
        const text = document.getElementById('favoriteText');
        
        if (isFavorite) {
            btn.classList.remove('btn-outline-danger');
            btn.classList.add('btn-danger');
            text.textContent = 'Favorited';
        } else {
            btn.classList.remove('btn-danger');
            btn.classList.add('btn-outline-danger');
            text.textContent = 'Favorite this book';
        }
    }
    
    // 收藏/取消收藏
    function toggleFavorite(isbn) {
        if (!userId) userId = initUserId();
        
        fetch('/book/favorite', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_id: userId, book_id: isbn })
        })
        .then(response => response.json())
        .then(data => {
            if (!data.error) {
                // 切换按钮状态
                const btn = document.getElementById('favoriteBtn');
                const isCurrentlyFavorite = btn.classList.contains('btn-danger');
                updateFavoriteButton(!isCurrentlyFavorite);
            } else {
                alert(data.message || '操作失败');
            }
        })
        .catch(error => {
            console.error("收藏错误:", error);
            alert('操作失败，请重试');
        });
    }
</script>
