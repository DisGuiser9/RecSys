<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorites - Book Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #e6f7fa;
        }
        .header-section {
            background: #e6f7fa;
            padding: 2.5rem 0 1.5rem 0;
            text-align: center;
        }
        .header-section h1 {
            font-weight: bold;
            color: #0099b8;
        }
        .header-section p {
            color: #0088a9;
            font-size: 1.2rem;
        }
        .book-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            transition: transform 0.2s;
            height: 100%;
            margin: 0 auto;
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.13);
        }
        .book-img {
            width: 80px;
            height: 110px;
            object-fit: cover;
            border-radius: 12px 12px 0 0;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        .book-title {
            font-size: 0.98rem;
            font-weight: 600;
            color: #222;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-author {
            color: #0099b8;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-meta {
            font-size: 0.85rem;
            color: #888;
        }
        .rating-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #00b894;
            color: #fff;
            font-size: 0.85rem;
            border-radius: 16px;
            padding: 0.15em 0.6em;
            font-weight: 500;
            z-index: 2;
        }
        .favorites-container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 2px 16px rgba(0,0,0,0.06);
            padding: 1.5rem 1.5rem 1rem 1.5rem;
            margin-bottom: 2rem;
        }
        .section-title {
            color: #0099b8;
            font-weight: bold;
            margin: 1.5rem 0 1.2rem 0;
            text-align: left;
            font-size: 1.3rem;
        }
        .no-favorites {
            text-align: center;
            padding: 3rem 0;
        }
        .no-favorites i {
            font-size: 3rem;
            color: #0099b8;
            margin-bottom: 1rem;
        }
        .loading {
            text-align: center;
            padding: 3rem 0;
        }
        .loading i {
            font-size: 3rem;
            color: #0099b8;
            margin-bottom: 1rem;
            animation: spin 1s infinite linear;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0099b8;">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-book-reader"></i> Book Recommender</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home"></i> Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/favorites"><i class="fas fa-heart"></i> My Favorites</a>
                    </li>
                </ul>
                <span class="navbar-text" id="navUserID">
                    <i class="fas fa-user-circle"></i> <span id="navUserDisplay"></span>
                </span>
            </div>
        </div>
    </nav>

    <div class="header-section">
        <h1>My Favorites</h1>
        <p>All your favorite books in one place</p>
    </div>

    <div class="container">
        <!-- Loading indicator -->
        <div id="loadingSection" class="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <h4>Loading favorites...</h4>
        </div>

        <!-- Favorites list -->
        <div id="favoritesSection" class="favorites-container" style="display:none;">
            <div class="section-title"><i class="fas fa-heart me-2"></i>My Favorite Books</div>
            <div class="row" id="favoriteBooks">
                <!-- Favorite books will be loaded here dynamically -->
            </div>
        </div>

        <!-- No favorites message -->
        <div id="noFavoritesSection" class="no-favorites favorites-container" style="display:none;">
            <i class="fas fa-heart"></i>
            <h4>You haven't added any favorites yet</h4>
            <p>Browse books and click the heart icon to add to favorites</p>
            <div class="mt-3">
                <a href="/" class="btn btn-info text-white me-2"><i class="fas fa-home"></i> Browse Recommendations</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        let currentUserId = null;
        
        // Initialize on page load
        $(document).ready(function() {
            initUserId();
            loadFavorites();
        });
        
        // Initialize user ID
        function initUserId() {
            // 从URL中获取用户ID（如果存在）
            const urlParams = new URLSearchParams(window.location.search);
            const urlUserId = urlParams.get('user_id');
            
            if (urlUserId) {
                // 如果URL中存在用户ID，使用并存储它
                currentUserId = urlUserId;
                localStorage.setItem('user_id', currentUserId);
            } else {
                // 否则从localStorage获取，如果没有，将在下一次页面加载时由后端分配
                currentUserId = localStorage.getItem('user_id');
            }
            
            // 更新导航栏中的用户ID显示
            $('#navUserDisplay').text(`自动匹配活跃用户`);
            return currentUserId;
        }
        
        // Load favorites
        function loadFavorites() {
            $('#loadingSection').show();
            $('#favoritesSection').hide();
            $('#noFavoritesSection').hide();
            
            console.log("加载收藏，用户ID:", currentUserId);
            
            fetch(`/user/favorites?user_id=${currentUserId}`)
                .then(response => {
                    console.log("收藏API响应状态:", response.status);
                    return response.json();
                })
                .then(data => {
                    console.log("收藏数据:", data);
                    $('#loadingSection').hide();
                    
                    if (!data.error && data.books && data.books.length > 0) {
                        console.log("渲染收藏书籍:", data.books.length, "本");
                        renderFavoriteBooks(data.books);
                        $('#favoritesSection').show();
                    } else {
                        console.log("没有收藏数据或发生错误:", data.error || "无收藏");
                        $('#noFavoritesSection').show();
                    }
                })
                .catch(error => {
                    console.error('Failed to load favorites:', error);
                    $('#loadingSection').hide();
                    $('#noFavoritesSection').show();
                });
        }
        
        // Render favorite books
        function renderFavoriteBooks(books) {
            console.log("开始渲染收藏书籍...");
            const container = $('#favoriteBooks');
            container.empty();
            
            if (!Array.isArray(books)) {
                console.error("书籍数据不是数组:", books);
                $('#noFavoritesSection').show();
                return;
            }
            
            books.forEach((book, index) => {
                console.log(`渲染第${index+1}本书:`, book.ISBN);
                const bookCard = `
                <div class="col-md-3 mb-4">
                    <div class="card book-card position-relative">
                        <img src="${book['Image-URL-M'] || 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/387928/book%20placeholder.png'}" class="card-img-top book-img" alt="${book['Book-Title']}" onerror="this.src='https://s3-us-west-2.amazonaws.com/s.cdpn.io/387928/book%20placeholder.png'">
                        <div class="card-body">
                            <div class="book-title">${book['Book-Title']}</div>
                            <div class="book-author"><i class="fas fa-user"></i> ${book['Book-Author']}</div>
                            <div class="book-meta mt-1">
                                <i class="fas fa-calendar-alt"></i> ${book['Year-Of-Publication'] || ''}<br>
                                <i class="fas fa-building"></i> ${book['Publisher'] || ''}
                            </div>
                            <div class="d-flex justify-content-between align-items-center mt-3">
                                <a href="/book/${book.ISBN}" class="btn btn-outline-info">View Details</a>
                                <button class="btn btn-danger btn-sm" onclick="toggleFavorite('${book.ISBN}')">
                                    <i class="fas fa-heart"></i> Favorited
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                `;
                container.append(bookCard);
            });
            console.log("收藏书籍渲染完成");
        }
        
        // Toggle favorite status
        function toggleFavorite(isbn) {
            if (!currentUserId) currentUserId = initUserId();
            const btn = document.querySelector(`.btn[onclick*="toggleFavorite('${isbn}')"]`);
            const isFavorite = btn && btn.classList.contains('btn-danger');
            
            fetch('/book/favorite', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, book_id: isbn })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.error) {
                    if (!data.is_favorite) {
                        // 已移除收藏，从页面上删除
                        $(btn).closest('.col-md-3').fadeOut(300, function() {
                            $(this).remove();
                            // 检查是否还有收藏的图书
                            if ($('#favoriteBooks').children().length === 0) {
                                $('#favoritesSection').hide();
                                $('#noFavoritesSection').show();
                            }
                        });
                    }
                } else {
                    alert(data.message || 'Operation failed');
                }
            })
            .catch(error => {
                console.error("Favorite error:", error);
                alert('Operation failed, please try again');
            });
        }
    </script>
</body>
</html>
